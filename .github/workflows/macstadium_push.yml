name: MacStadium CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  macfuse:
    runs-on: macstadium
    env:
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macfuse-ci
